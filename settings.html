<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตั้งค่าเมนู 356</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="manager-auth.js"></script>
</head>
<body>
  <header>
    <b>⚙️ ตั้งค่าเมนู</b>
    <div class="header-actions">
      <a class="header-link-button" href="kitchen.html">← กลับหลังร้าน</a>
    </div>
  </header>

  <main>
    <section class="menu-settings-toolbar">
      <label for="menuSettingsSearch">🔍 ค้นหาเมนู</label>
      <input id="menuSettingsSearch" type="search" placeholder="ชื่อเมนูหรือหมวดหมู่">
      <select id="menuSettingsCategory">
        <option value="ทั้งหมด">ทุกหมวดหมู่</option>
      </select>
      <button id="addMenuButton" class="add-menu-button" type="button">➕ เพิ่มเมนูใหม่</button>
    </section>

    <section class="menu-settings-summary">
      <div><span>รายการทั้งหมด</span><strong id="allMenuCount">0</strong></div>
      <div><span>เปิดขาย</span><strong id="activeMenuCount">0</strong></div>
      <div><span>ปิดขาย</span><strong id="inactiveMenuCount">0</strong></div>
    </section>

    <section id="menuSettingsList" class="menu-settings-list"></section>

    <div class="menu-settings-save-bar">
      <div id="menuSettingsStatus">ยังไม่มีการแก้ไข</div>
      <button id="saveMenuSettingsButton" class="primary" type="button" disabled>
        บันทึกการเปลี่ยนแปลง
      </button>
    </div>

    <footer class="version-label">356 POS V1.5.2 — Easy Menu Options</footer>
  </main>


  <div id="menuEditorModal" class="menu-editor-modal" aria-hidden="true">
    <div class="menu-editor-backdrop" data-close-menu-editor></div>
    <section class="menu-editor-dialog" role="dialog" aria-modal="true">
      <div class="menu-editor-header">
        <h2 id="menuEditorTitle">เพิ่มเมนูใหม่</h2>
        <button id="closeMenuEditorButton" type="button">✕</button>
      </div>

      <label class="menu-editor-field">
        <span>ประเภท</span>
        <select id="editorItemType">
          <option value="product">เมนูเครื่องดื่ม/อาหาร</option>
          <option value="addon">ADD-ON</option>
        </select>
      </label>

      <label class="menu-editor-field">
        <span>ชื่อเมนู</span>
        <input id="editorItemName" type="text" maxlength="100" placeholder="เช่น มัทฉะลาเต้">
      </label>

      <label id="editorCategoryWrap" class="menu-editor-field">
        <span>หมวดหมู่</span>
        <select id="editorCategory">
          <option value="">เลือกหมวดหมู่</option>
          <option value="ชา & นม">ชา & นม</option>
          <option value="กาแฟ">กาแฟ</option>
          <option value="สมูทตี้">สมูทตี้</option>
          <option value="โซดา">โซดา</option>
          <option value="ขนมปังปิ้ง">ขนมปังปิ้ง</option>
          <option value="ปังเย็น">ปังเย็น</option>
          <option value="อื่น ๆ">อื่น ๆ</option>
        </select>
      </label>

      <label class="menu-editor-field">
        <span>ราคา (บาท)</span>
        <input id="editorPrice" type="number" min="0" step="1" inputmode="decimal">
      </label>

      <section id="editorOptionsWrap" class="menu-option-panel">
        <h3>ตัวเลือกของเมนู</h3>

        <div class="editor-option-group">
          <div class="editor-option-title">ความหวาน</div>
          <label>
            <input type="radio" name="editorSweetMode" value="" checked>
            ไม่มีตัวเลือกความหวาน
          </label>
          <label>
            <input type="radio" name="editorSweetMode" value="sweet">
            ไม่หวาน / หวานน้อย / ปกติ / เพิ่มหวาน
          </label>
          <label>
            <input type="radio" name="editorSweetMode" value="sweet_no_zero">
            หวานน้อย / ปกติ / เพิ่มหวาน
          </label>
        </div>

        <div class="editor-option-group">
          <div class="editor-option-title">ชนิดนม</div>
          <label>
            <input id="editorMilkOption" type="checkbox" value="milk">
            นมสด / นมโอ๊ต
          </label>
        </div>

        <div class="editor-option-group">
          <div class="editor-option-title">เพิ่มเติม</div>
          <label>
            <input type="radio" name="editorExtrasMode" value="" checked>
            ไม่มีรายการเพิ่มเติม
          </label>
          <label>
            <input type="radio" name="editorExtrasMode" value="extras_all">
            ปั่น +10 / ไข่มุกบุก +10 / ปีโป้ +10 / โยเกิร์ต +10 / ครีมชีส +15
          </label>
          <label>
            <input type="radio" name="editorExtrasMode" value="extras_no_blend">
            ไข่มุกบุก +10 / ปีโป้ +10 / โยเกิร์ต +10 / ครีมชีส +15
          </label>
          <label>
            <input type="radio" name="editorExtrasMode" value="extras_soda">
            ตัวเลือกเพิ่มเติมสำหรับโซดา
          </label>
          <label>
            <input id="editorYogurtOption" type="checkbox" value="yogurt">
            ใส่โยเกิร์ต +10
          </label>
        </div>

        <div class="editor-option-group">
          <div class="editor-option-title">ขนาดแก้ว</div>
          <label>
            <input id="editorSizeOption" type="checkbox" value="size">
            อัปไซส์แก้วใหญ่ +10
          </label>
        </div>
      </section>

      <label class="menu-active-editor">
        <input id="editorIsActive" type="checkbox" checked>
        <span>เปิดขายทันที</span>
      </label>

      <div id="menuEditorError" class="menu-editor-error"></div>

      <div class="menu-editor-actions">
        <button id="deleteCustomMenuButton" class="delete-menu-button hidden" type="button">ลบเมนู</button>
        <button id="saveMenuEditorButton" class="primary" type="button">บันทึกเมนู</button>
      </div>
    </section>
  </div>

  <script src="settings.js"></script>
</body>
</html>
