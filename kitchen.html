<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>356 หลังร้าน</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
  <header>
    <b>356 หลังร้าน</b>
    <div class="header-actions">
      <button id="soundToggle" type="button">🔇 เปิดเสียง</button>
      <button id="refreshButton" type="button">รีเฟรช</button>
    </div>
  </header>

  <main>
    <div id="soundHint" class="sound-hint">
      แตะ “เปิดเสียง” 1 ครั้ง แล้วต้องได้ยินเสียงทดสอบ
    </div>

    <section class="dashboard" aria-label="สรุปยอดวันนี้">
      <div class="dashboard-title">📊 สรุปวันนี้</div>
      <div class="dashboard-grid">
        <div class="summary-card"><span>ออเดอร์</span><strong id="todayOrderCount">0</strong></div>
        <div class="summary-card"><span>ยอดรวม</span><strong id="todaySales">฿0</strong></div>
        <div class="summary-card"><span>จ่ายที่เคาน์เตอร์</span><strong id="todayCash">฿0</strong></div>
        <div class="summary-card"><span>พร้อมเพย์</span><strong id="todayPromptPay">฿0</strong></div>
      </div>
      <div class="status-counts">
        <span class="count-new">NEW <b id="newCount">0</b></span>
        <span class="count-making">กำลังทำ <b id="makingCount">0</b></span>
        <span class="count-ready">พร้อมเสิร์ฟ <b id="readyCount">0</b></span>
      </div>
    </section>

    <nav class="order-tabs" aria-label="หมวดออเดอร์">
      <button type="button" class="order-tab active" data-tab="active">📥 ออเดอร์ใหม่ <span id="activeTabCount">0</span></button>
      <button type="button" class="order-tab" data-tab="ready">🟢 พร้อมเสิร์ฟวันนี้ <span id="readyTabCount">0</span></button>
      <button type="button" class="order-tab" data-tab="history">📜 ประวัติ <span id="historyTabCount">0</span></button>
    </nav>

    <section class="search-panel">
      <label for="orderSearch">🔍 ค้นหาออเดอร์</label>
      <input id="orderSearch" type="search" placeholder="เลขออเดอร์ ชื่อลูกค้า โต๊ะ หรือชื่อเมนู">
      <div id="searchResultCount" class="search-result-count"></div>
    </section>

    <div id="orders"></div>
    <footer class="version-label">356 POS V1.1.2</footer>
  </main>

  <audio id="dingAudio" src="notification.wav" preload="auto"></audio>
  <script src="kitchen.js"></script>
</body>
</html>
