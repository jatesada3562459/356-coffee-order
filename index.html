<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>356 Coffee & Drink</title>
  <link rel="stylesheet" href="style.css?v=1620">
  <!-- Local scripts only: no external CDN, so mobile/4G cannot be blocked by jsDelivr -->
  <script defer src="config.js"></script>
  <script defer src="supabase-lite.js?v=16545"></script>
  <script defer src="storefront-v3.js?v=16560"></script>
  <script defer src="language.js?v=16561"></script>
</head>
<body>
<header>
  <b>356 Coffee & Drink</b>
  <div class="customer-header-actions">
    <div class="language-switch" aria-label="Language">
      <button id="langThBtn" class="lang-btn active" type="button" onclick="setLanguage356('th')">ไทย</button>
      <button id="langEnBtn" class="lang-btn" type="button" onclick="setLanguage356('en')">EN</button>
    </div>
    <button onclick="openCart()"><span data-i18n="cart">ตะกร้า</span> <span id="count">0</span></button>
  </div>
</header>
<main>
  <section class="store-hero">
    <div id="storeCoverWrap" class="store-cover-wrap">
      <div id="storeCoverPlaceholder" class="store-cover-placeholder">356 Coffee & Drink</div>
      <img id="storeCoverImage" class="store-cover-image hidden" alt="รูปหน้าปกร้าน">
    </div>

    <div class="store-profile-row">
      <div id="storeLogoWrap" class="store-logo-wrap">
        <div id="storeLogoPlaceholder" class="store-logo-placeholder">356</div>
        <img id="storeLogoImage" class="store-logo-image hidden" alt="โลโก้ร้าน">
      </div>

      <div class="store-profile-text">
        <h1 id="storeName">356 Coffee & Drink</h1>
        <p id="storeDescription">เครื่องดื่มและขนมจากร้าน 356</p>
        <div class="store-meta">
          <span id="storeStatusBadge" class="store-status-badge">กำลังตรวจสอบสถานะร้าน</span>
          <span id="storeHours">09:00–16:00</span>
        </div>
      </div>
    </div>

    <div id="table" class="store-order-location"></div>
  </section>

  <div class="tabs" id="tabs"></div>
  <div class="grid" id="menu"><p style="grid-column:1/-1;text-align:center;padding:18px 0">กำลังโหลดเมนู... / Loading menu...</p></div>
</main>

<div class="panel" id="product">
  <div class="wrap">
    <button onclick="closeProduct()">← <span data-i18n="back">กลับ</span></button>
    <h2 id="pname"></h2>
    <div id="modifierArea" class="opts"></div>
    <h3 data-i18n="quantity">จำนวน</h3>
    <div class="qty">
      <button onclick="changeQty(-1)">−</button>
      <span id="qtyValue">1</span>
      <button onclick="changeQty(1)">+</button>
    </div>
    <br>
    <button class="primary" id="saveBtn" onclick="saveProduct()">เพิ่มลงตะกร้า</button>
  </div>
</div>

<div class="panel" id="addonPanel">
  <div class="wrap">
    <button onclick="closeAddon()">← <span data-i18n="back">กลับ</span></button>
    <h2 id="addonTitle"></h2>
    <div id="addonTargets"></div>
  </div>
</div>

<div class="panel" id="cart">
  <div class="wrap">
    <button onclick="closeCart()">← <span data-i18n="back">กลับ</span></button>
    <h2 data-i18n="cartTitle">ตะกร้า</h2>
    <div id="items"></div>
    <div class="total" id="total"></div>
    <h3 data-i18n="customerName">ชื่อลูกค้า</h3>
    <input id="customer" type="text" placeholder="กรอกชื่อลูกค้า" data-i18n-placeholder="customerPlaceholder">
    <h3 data-i18n="payment">ชำระเงิน</h3>
    <label><input type="radio" name="pay" value="counter" checked> <span data-i18n="payCounter">จ่ายที่เคาน์เตอร์</span></label><br>
    <label><input type="radio" name="pay" value="promptpay"> <span data-i18n="promptPay">พร้อมเพย์</span></label><br><br>
    <button class="primary" onclick="submitOrder()" data-i18n="submitOrder">ยืนยันออร์เดอร์</button>
  </div>
</div>
</body>
</html>
