<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>356 Coffee & Drink</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<header><b>356 Coffee & Drink</b><button onclick="openCart()">ตะกร้า <span id="count">0</span></button></header>
<main><div class="hero"><h1>สั่งเครื่องดื่มและขนม</h1><div id="table"></div></div><div class="tabs" id="tabs"></div><div class="grid" id="menu"></div></main>
<div class="panel" id="product"><div class="wrap"><button onclick="closeProduct()">← กลับ</button><h2 id="pname"></h2><div class="opts">
<h3>ความหวาน</h3><label><input type="radio" name="sweet" value="ไม่หวาน"> ไม่หวาน</label><label><input type="radio" name="sweet" value="หวานน้อย"> หวานน้อย</label><label><input type="radio" name="sweet" value="ปกติ" checked> ปกติ</label><label><input type="radio" name="sweet" value="เพิ่มหวาน"> เพิ่มหวาน</label>
<h3>นม</h3><label><input type="radio" name="milk" value="นมสด" checked> นมสด</label><label><input type="radio" name="milk" value="นมโอ๊ต"> นมโอ๊ต (ฟรี)</label>
<h3>ตัวเลือกเพิ่ม</h3><label><input type="checkbox" class="add" value="ปั่น" data-price="10"> ปั่น +10</label><label><input type="checkbox" class="add" value="ปีโป้" data-price="10"> ปีโป้ +10</label><label><input type="checkbox" class="add" value="ไข่มุกบุก" data-price="10"> ไข่มุกบุก +10</label><label><input type="checkbox" class="add" value="โยเกิร์ต" data-price="10"> โยเกิร์ต +10</label><label><input type="checkbox" class="add" value="ครีมชีส" data-price="15"> ครีมชีส +15</label><label><input type="checkbox" class="add" value="ช็อตกาแฟ" data-price="20"> ช็อตกาแฟ +20</label><label><input type="checkbox" class="add" value="แก้วใหญ่" data-price="10"> อัปไซส์ +10</label>
<h3>จำนวน</h3><select id="qty"></select></div><button class="primary" onclick="addCart()">เพิ่มลงตะกร้า</button></div></div>
<div class="panel" id="cart"><div class="wrap"><button onclick="closeCart()">← กลับ</button><h2>ตะกร้า</h2><div id="items"></div><div class="total" id="total"></div><h3>ชื่อลูกค้า</h3><input id="customer" style="width:100%;padding:12px"><h3>ชำระเงิน</h3><label><input type="radio" name="pay" value="counter" checked> จ่ายที่เคาน์เตอร์</label><br><label><input type="radio" name="pay" value="promptpay"> PromptPay</label><br><br><button class="primary" onclick="submitOrder()">ยืนยันออร์เดอร์</button></div></div>
<script src="app.js"></script></body></html>
